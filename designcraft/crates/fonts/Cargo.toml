[package]
name = "designcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignCraft fonts: font database (bundled OFL + system), metrics, glyph outlines, shaping"

[lints]
workspace = true

[features]
# Synthetic fonts for other crates' tests (`designcraft_fonts::testing`).
testing = []
# Septet turns this on: CRAFT_FONTS refers to the fonts embedded once for all apps.
shared-craft-fonts = ["dep:shared-craft-fonts"]

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
log = { workspace = true }
# Septet: the suite's single copy of the craft fonts (`shared-craft-fonts` feature, see build.rs).
shared-craft-fonts = { path = "../../../shared/craft-fonts", optional = true }
