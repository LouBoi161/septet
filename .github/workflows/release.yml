# Builds Septet for Windows, Linux and macOS on native runners and, for a version tag (v1.2.3),
# publishes a GitHub release with every download. The same files are then mirrored to the GitLab
# release (see RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The apps' build scripts must not put their own icons into septet.exe.
  HOSTED_BUILD: "1"
  # Chinese, Japanese and Arabic fonts (checked out below); a bad checkout fails the build.
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
  CRAFT_FONTS_REQUIRED: "1"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - name: macOS Intel
            os: macos-15
            target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0 # bump deliberately
          path: craft-fonts

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake nasm libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev imagemagick librsvg2-bin file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          # macOS runners have 7 GB of memory: skip link-time optimization there.
          if [[ "$RUNNER_OS" == "macOS" ]]; then export CARGO_PROFILE_RELEASE_LTO=off; fi
          cargo build --release --locked -p septet --target ${{ matrix.target }}

      - name: Third-party licenses
        shell: bash
        run: python3 scripts/third_party_licenses.py --target ${{ matrix.target }} > THIRD-PARTY-LICENSES.md

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: septet/packaging/linux/build-appimage.sh target/${{ matrix.target }}/release/septet "$VERSION" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:VERSION
          $stage = "stage\Septet"
          New-Item -ItemType Directory -Force $stage, dist | Out-Null
          Copy-Item target\${{ matrix.target }}\release\septet.exe $stage
          Copy-Item LICENSE.md, NOTICE.md, THIRD-PARTY-LICENSES.md, README.md $stage
          Copy-Item septet\assets\septet.ico stage\
          # Portable: the same files plus the marker that keeps all data next to septet.exe.
          Copy-Item septet\packaging\windows\portable.txt $stage
          Compress-Archive -Path $stage -DestinationPath "dist\Septet-$v-windows-x64-portable.zip"
          Remove-Item "$stage\portable.txt"
          Copy-Item stage\septet.ico $stage
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=$((Resolve-Path $stage).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" septet\packaging\windows\septet.iss
          Get-ChildItem dist

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: septet/packaging/macos/make-dmg.sh target/${{ matrix.target }}/release/septet "$VERSION" ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: septet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Septet ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
