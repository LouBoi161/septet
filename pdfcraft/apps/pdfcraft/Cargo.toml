[package]
name = "pdfcraft"
description = "PdfCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The app as a library: its settings and `Embedded`, PdfCraft running as a tab of a host window
# (Septet). The `pdfcraft` binary (src/main.rs) is unchanged.
[lib]
name = "pdfcraft_embed"
path = "src/lib.rs"

[features]
# The OpenGL fallback renderer of the `pdfcraft` binary (main.rs), on in the packaging scripts.
# Not a default: eframe's `glow` feature changes `eframe::App::on_exit` for every app built with
# it, and a host (Septet) that uses this package as a library builds its apps without it.
gl-fallback = ["eframe/glow"]

[dependencies]
# Help ▸ Check for updates (issue #28): one HTTPS request to GitHub, over rustls with the OS's
# trusted roots. No bundled root list (webpki-roots and webpki-root-certs are CDLA-licensed).
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"
pdfcraft-ui-egui = { workspace = true }
# The agent methods of embed.rs: the automation tools on the app's own session, page renders.
pdfcraft-automation = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-render = { workspace = true }
# wgpu draws; OpenGL (glow) is the fallback when wgpu can't start on an old or unusual GPU or
# driver (#461, #435, #392), and can be chosen with PDFCRAFT_RENDERER=gl: feature `gl-fallback`.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
# Records from every crate go to standard error and the log file (src/logging.rs).
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click / Open With / Dock drops arrive as Apple events (#73); this small audited
# crate registers the handler (Objective-C interop needs unsafe, which our workspace forbids)
# behind a safe API. Same version as PhotoCraft. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[dev-dependencies]
# Waits for wgpu's adapter, device and error-scope futures in tests (already in the tree through wgpu).
pollster = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Which GPU drives which display (EnumDisplayDevices), so the window is drawn on the GPU that
# shows it (issue #378). Safe wrappers over Win32; only the `user` feature (which brings `kernel` with it).
winsafe = { version = "0.0.29", default-features = false, features = ["user"] }

[build-dependencies]
# Icon + VERSIONINFO for pdfcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
