[package]
name = "pdfcraft-fonts"
description = "Font metrics and text encoding helpers for generated appearances (standard fonts, WinAnsi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# Glyph outlines of the bundled script font (typed signatures); already in the tree via egui.
skrifa = "0.44"
# Arabic shaping for text written into PDFs; already in the tree via egui, on the same read-fonts.
harfrust = "0.12"
unicode-bidi = "0.3"
# Septet: the suite's single copy of the craft fonts (`shared-craft-fonts` feature, see build.rs).
shared-craft-fonts = { path = "../../../shared/craft-fonts", optional = true }

[features]
# Septet turns this on: CRAFT_FONTS refers to the fonts embedded once for all apps.
shared-craft-fonts = ["dep:shared-craft-fonts"]
