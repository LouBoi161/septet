[package]
name = "lightcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "lightcraft"

# The app as a library (settings, services, library session) for main.rs, and `Embedded`: LightCraft
# as a tab of a host application (Septet).
[lib]
name = "lightcraft_embed"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["denoise"]
denoise = ["lightcraft-engine/denoise"]
rawnind-model = ["denoise", "lightcraft-engine/rawnind-model"]
# Open HEIC/HEIF photos (the optional lightcraft-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["lightcraft-codecs/heif"]
# The window's last-resort OpenGL renderer (eframe's glow; `window_gpu`), on in the packaging
# scripts. Not a default: eframe's `glow` feature changes `eframe::App::on_exit` for every app
# built with it, and a host (Septet) that uses this package as a library builds its apps without it.
gl-fallback = ["eframe/glow"]

[dependencies]
lightcraft-engine = { workspace = true, features = ["sam"] }
lightcraft-sysmem = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# probing the window's renderer before it opens (`window_gpu`)
pollster = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for lightcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
