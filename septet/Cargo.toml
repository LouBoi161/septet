[package]
name = "septet"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Septet: Photocraft, Vectorcraft, Lightcraft, Designcraft, Pdfcraft, Filmcraft and Effectcraft in one tabbed, multi-window shell"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
rfd = "0.17"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
# Conversation ids for Claude Code (assistant/).
uuid = { version = "1", features = ["v4"] }
# Images in tool results (assistant/panel.rs).
base64 = "0.22"
# septet_fetch: icons and fonts for Claude, over rustls with the OS's trusted roots (as Pdfcraft does).
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"
photocraft-ui-egui = { path = "../photocraft/crates/ui-egui", optional = true }
vectorcraft-ui-egui = { path = "../vectorcraft/crates/ui-egui", optional = true }
lightcraft-ui-egui = { path = "../lightcraft/crates/ui-egui", optional = true }
designcraft-ui-egui = { path = "../designcraft/crates/ui-egui", optional = true }
pdfcraft-ui-egui = { path = "../pdfcraft/crates/ui-egui", optional = true }
filmcraft-ui-egui = { path = "../filmcraft/crates/ui-egui", optional = true }
effectcraft-ui-egui = { path = "../effectcraft/crates/ui-egui", optional = true }
# The apps' desktop packages, used as libraries (their `embed` API builds each app for a tab).
photocraft = { path = "../photocraft/apps/photocraft", optional = true }
vectorcraft = { path = "../vectorcraft/apps/vectorcraft", optional = true }
lightcraft = { path = "../lightcraft/apps/lightcraft", optional = true }
designcraft = { path = "../designcraft/apps/designcraft", optional = true }
pdfcraft = { path = "../pdfcraft/apps/pdfcraft", optional = true }
filmcraft = { path = "../filmcraft/apps/filmcraft", optional = true }
effectcraft = { path = "../effectcraft/apps/effectcraft", optional = true }
# The apps' font crates, only to turn on `shared-craft-fonts`: the craft fonts are embedded once
# (`shared/craft-fonts`), not once per app.
photocraft-text = { path = "../photocraft/crates/text", optional = true, features = ["shared-craft-fonts"] }
vectorcraft-text = { path = "../vectorcraft/crates/text", optional = true, features = ["shared-craft-fonts"] }
lightcraft-engine = { path = "../lightcraft/crates/engine", optional = true, features = ["shared-craft-fonts"] }
designcraft-fonts = { path = "../designcraft/crates/fonts", optional = true, features = ["shared-craft-fonts"] }
pdfcraft-fonts = { path = "../pdfcraft/crates/fonts", optional = true, features = ["shared-craft-fonts"] }
filmcraft-text = { path = "../filmcraft/crates/text", optional = true, features = ["shared-craft-fonts"] }

# One feature per app; a build without one leaves the app out (`kinds::APPS`). Saved sessions and
# recent files that name it are skipped.
[features]
default = ["photocraft", "vectorcraft", "lightcraft", "designcraft", "pdfcraft", "filmcraft", "effectcraft"]
photocraft = ["dep:photocraft", "dep:photocraft-ui-egui", "dep:photocraft-text"]
vectorcraft = ["dep:vectorcraft", "dep:vectorcraft-ui-egui", "dep:vectorcraft-text"]
lightcraft = ["dep:lightcraft", "dep:lightcraft-ui-egui", "dep:lightcraft-engine"]
designcraft = ["dep:designcraft", "dep:designcraft-ui-egui", "dep:designcraft-fonts"]
pdfcraft = ["dep:pdfcraft", "dep:pdfcraft-ui-egui", "dep:pdfcraft-fonts"]
filmcraft = ["dep:filmcraft", "dep:filmcraft-ui-egui", "dep:filmcraft-text"]
effectcraft = ["dep:effectcraft", "dep:effectcraft-ui-egui"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Only for EventLoopBuilderExtX11 (XWayland by default, see main.rs).
winit = { version = "0.30", default-features = false, features = ["x11"] }
# The pointer position for file drops (pointer.rs).
x11rb = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
# Ending Claude Code's process group (assistant/session.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# GetCursorPos for file drops (pointer.rs).
winsafe = { version = "0.0.29", default-features = false, features = ["user"] }

[target.'cfg(windows)'.build-dependencies]
# Icon and version info for septet.exe (build.rs).
winresource = "0.1"
